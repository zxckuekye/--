  <rect x="113" y="97" width="5" height="4" fill="#72604c"/>
  <rect x="109" y="99" width="12" height="3" fill="#544a3b"/>

  <!-- vignette and subtle frame -->
  <path d="M0 0H320V180H0Z" fill="none" stroke="#111418" stroke-width="7"/>
  <rect x="3" y="3" width="314" height="174" fill="none" stroke="#59636a" stroke-width="1" opacity=".38"/>
