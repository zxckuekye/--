  <text x="13" y="80" fill="#c6c8b6" font-family="monospace" font-size="4">ОЧЕРЕДЬ</text>
  <text x="13" y="87" fill="#d0ad68" font-family="monospace" font-size="6">№ 004</text>
  <path d="M30 83h5v5h-5z" fill="#a58a61"/>

  <!-- cabinet and files -->
  <rect x="55" y="63" width="34" height="47" fill="#303940" stroke="#14181c" stroke-width="3"/>
  <rect x="59" y="67" width="26" height="8" fill="#3c4850" stroke="#68737a"/>
  <rect x="59" y="78" width="26" height="8" fill="#39454c" stroke="#68737a"/>
  <rect x="59" y="89" width="26" height="8" fill="#3c4850" stroke="#68737a"/>
