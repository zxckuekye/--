  <rect x="92" y="81" width="1" height="1" fill="#d3c28e"/>
  <rect x="114" y="95" width="1.5" height="1.5" fill="#9ba9a0"/>
  <rect x="265" y="63" width="1.5" height="1.5" fill="#d6bb7e"/>
  <rect x="287" y="101" width="1" height="1" fill="#a7b4a5"/>
  <rect x="155" y="28" width="1.5" height="1.5" fill="#d3c28e"/>

