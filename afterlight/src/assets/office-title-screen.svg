<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 320 180" shape-rendering="crispEdges">
  <defs>
    <pattern id="wall" width="32" height="24" patternUnits="userSpaceOnUse">
      <rect width="32" height="24" fill="#28313a"/>
      <path d="M0 23.5H32M31.5 0V24" stroke="#3a454b" stroke-width="1" opacity=".65"/>
      <path d="M3 3H27" stroke="#343e45" opacity=".55"/>
    </pattern>
    <pattern id="tiles" width="20" height="12" patternUnits="userSpaceOnUse">
      <rect width="20" height="12" fill="#242a2d"/>
      <path d="M0 0H20M0 0V12M10 0V6M0 6H20M20 6V12" stroke="#465057" stroke-width="1" opacity=".78"/>
      <path d="M2 2H8M12 8H18" stroke="#313a3e"/>
    </pattern>
    <linearGradient id="hall" x2="0" y2="1">
      <stop stop-color="#38434a"/><stop offset=".72" stop-color="#30383d"/><stop offset="1" stop-color="#1b2024"/>
    </linearGradient>
    <linearGradient id="warmWindow" x2="0" y2="1">
      <stop stop-color="#e5c77c"/><stop offset=".55" stop-color="#ad8855"/><stop offset="1" stop-color="#514941"/>
    </linearGradient>
    <radialGradient id="lampGlow">
      <stop stop-color="#e9c878" stop-opacity=".42"/><stop offset="1" stop-color="#e9c878" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="screenGlow">
      <stop stop-color="#78a997" stop-opacity=".3"/><stop offset="1" stop-color="#78a997" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Deep, tiled institutional interior -->
  <rect width="320" height="180" fill="#171a20"/>
  <rect width="320" height="113" fill="url(#wall)"/>
  <rect y="0" width="320" height="15" fill="#1b2025"/>
  <path d="M0 15H320M0 17H320" stroke="#56616a" opacity=".7"/>
  <path d="M18 0V14M76 0V14M142 0V14M210 0V14M281 0V14" stroke="#303941" stroke-width="2"/>

  <!-- fluorescent strips, one failing -->
  <rect x="37" y="7" width="42" height="3" fill="#687d8c"/>
  <rect x="39" y="7" width="37" height="1" fill="#d1d4c1" opacity=".72"/>
  <rect x="195" y="7" width="50" height="3" fill="#66777d"/>
