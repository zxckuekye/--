  <path d="M178 39h4v4h-4z" fill="#d38a64"/>

  <!-- Someone is waiting behind the impossible service window -->
  <rect x="188" y="69" width="5" height="5" fill="#171a20"/>
  <rect x="186" y="74" width="9" height="9" fill="#20272a"/>
  <rect x="184" y="76" width="3" height="5" fill="#20272a"/>
  <rect x="194" y="76" width="3" height="5" fill="#20272a"/>
