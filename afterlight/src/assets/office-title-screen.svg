  <rect x="82" y="28" width="22" height="22" fill="#171a20"/>
  <rect x="84" y="30" width="18" height="18" fill="#a9a995"/>
  <path d="M93 32v7h6M93 39l-5 5" stroke="#303638" stroke-width="1.5" fill="none"/>
  <rect x="92" y="38" width="2" height="2" fill="#873f43"/>
  <rect x="91" y="25" width="4" height="2" fill="#56616a"/>

  <!-- tile floor and perspective path -->
  <rect y="112" width="320" height="68" fill="url(#tiles)"/>
  <path d="M0 112H320" stroke="#7b817a" stroke-width="2"/>
  <path d="M99 112L132 180M220 112L190 180" stroke="#68716e" stroke-width="2" opacity=".55"/>
  <path d="M0 132H320M0 153H320" stroke="#59615f" opacity=".5"/>
  <path d="M110 124H210M119 139H201M129 157H191" stroke="#a58a61" opacity=".16" stroke-width="2"/>

