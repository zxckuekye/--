  <rect x="207" y="96" width="7" height="3" fill="#6e7169"/>
  <rect x="202" y="98" width="18" height="2" fill="#77796e"/>

  <!-- warm desk lamp -->
  <path d="M272 97V80l-8-8" stroke="#a58a61" stroke-width="2" fill="none"/>
  <path d="M258 68h18l5 8h-28z" fill="#a58a61" stroke="#191b1d" stroke-width="2"/>
  <rect x="258" y="77" width="14" height="2" fill="#e3c37b"/>
  <rect x="266" y="80" width="2" height="15" fill="#776b51"/>
  <rect x="259" y="95" width="15" height="2" fill="#988463"/>
  <path d="M252 99h29v1h-29" fill="#d0aa60" opacity=".6"/>

  <!-- cup, stamp, paper stack, lonely plant -->
  <rect x="286" y="94" width="8" height="6" fill="#65675f" stroke="#181b1d"/>
  <path d="M294 95h3v3h-3" stroke="#77796f" fill="none"/>
  <rect x="298" y="101" width="13" height="2" fill="#873f43"/>
  <rect x="300" y="98" width="11" height="3" fill="#d2cbb3"/>
  <rect x="303" y="96" width="9" height="2" fill="#c4bfa9"/>
  <rect x="111" y="91" width="7" height="7" fill="#566548"/>
  <rect x="107" y="86" width="5" height="7" fill="#71815c"/>
