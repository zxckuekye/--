  <rect x="117" y="97" width="203" height="7" fill="#6c6251" stroke="#111518" stroke-width="2"/>
  <path d="M122 104H318V123H122Z" fill="#47433b" stroke="#171a1d" stroke-width="2"/>
  <path d="M129 107H309V119H129Z" fill="#51483c"/>
  <path d="M146 109h45v7h-45zM224 108h32v9h-32z" fill="#393a36"/>
  <path d="M151 110h35v1h-35m0 2h28m-28 2h31" stroke="#b9b49f" stroke-width="1" opacity=".7"/>
  <path d="M235 110h24v1h-24m0 2h18m-18 2h21" stroke="#aaa998" stroke-width="1" opacity=".62"/>
  <rect x="193" y="75" width="34" height="21" fill="#20262a" stroke="#111518" stroke-width="3"/>
  <rect x="197" y="78" width="26" height="14" fill="#364b47"/>
  <rect x="199" y="80" width="19" height="2" fill="#83a48f"/>
  <rect x="199" y="84" width="14" height="1" fill="#91ab91"/>
