  <rect x="229" y="7" width="7" height="1" fill="#a58a61"/>
  <path d="M235 10l4 4-2 1 5 5" stroke="#a58a61" stroke-width="1" fill="none" opacity=".7"/>

  <!-- long corridor perspective -->
  <path d="M105 24H298V115H105Z" fill="url(#hall)" stroke="#15191d" stroke-width="4"/>
  <path d="M119 34H286V111H119Z" fill="#303940" stroke="#5a6467" stroke-width="2"/>
  <path d="M128 39H276V108H128Z" fill="#252d33"/>
  <path d="M132 44H269V101H132Z" fill="#303a3f"/>
  <path d="M140 47H260V98H140Z" fill="#293137"/>
  <path d="M147 52H252V94H147Z" fill="#252c31"/>
